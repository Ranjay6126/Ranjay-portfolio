# NGINX configuration for portfolio application
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  
  access_log /var/log/nginx/access.log main;

  # Performance optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript 
             application/x-javascript application/xml+rss 
             application/json application/javascript;
  gzip_disable "MSIE [1-6]\.(?!.*SV1)";
  gzip_comp_level 6;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Upstream backend service
  upstream backend {
    server portfolio-server:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=2r/m;

  server {
    listen 80;
    server_name _;

    # Security: disable server tokens
    server_tokens off;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Static files caching - long cache for versioned files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # HTML files - no caching for SPA
    location ~* \.html?$ {
      add_header Cache-Control "public, max-age=0, must-revalidate";
      try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health.html {
      access_log off;
      return 200 "healthy";
      add_header Content-Type text/html;
    }

    # API routes - proxy to backend
    location /portfolio-api/ {
      limit_req zone=api_limit burst=20 nodelay;

      # Rate limiting for contact form specifically
      location /portfolio-api/messages {
        limit_req zone=contact_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        client_body_timeout 30s;
        send_timeout 30s;
      }

      # Default proxy settings for other API routes
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_redirect off;
      
      # Timeouts for backend requests
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # SPA routing fallback
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Deny access to sensitive files
    location ~ /\. {
      deny all;
      access_log off;
    }

    location ~ ~$ {
      deny all;
      access_log off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
