name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME || 'ranjay8848' }}
  IMAGE_NAME_CLIENT: ${{ secrets.DOCKER_USERNAME || 'ranjay8848' }}/portfolio-client
  IMAGE_NAME_SERVER: ${{ secrets.DOCKER_USERNAME || 'ranjay8848' }}/portfolio-server

jobs:
  # Stage 1: Build Docker images
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    outputs:
      client-tag: ${{ steps.meta-client.outputs.tags }}
      server-tag: ${{ steps.meta-server.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.client
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          no-cache: true

      - name: Image digest
        run: |
          echo "Client Image: ${{ steps.meta-client.outputs.tags }}"
          echo "Server Image: ${{ steps.meta-server.outputs.tags }}"

  # Stage 2: Security scanning (optional but recommended)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          npm audit --prefix server --audit-level=moderate || true
          npm audit --prefix client --audit-level=moderate || true

  # Stage 3: Deploy to AWS EC2 (only on main branch)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST || '100.53.83.160' }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'ranjay8848' }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          echo "Deployment target: $EC2_HOST:$EC2_PORT"
          test -n "$EC2_HOST" || { echo "Missing required GitHub secret: EC2_HOST (your EC2 public IPv4 address or DNS name)"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "Missing required GitHub secret: EC2_SSH_KEY"; exit 1; }
          test "$EC2_PORT" = "22" || { echo "EC2_PORT must be 22 for this EC2 instance."; exit 1; }

          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2-deploy-key"
          chmod 600 "$RUNNER_TEMP/ec2-deploy-key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ec2-deploy-key" > /dev/null 2>&1; then
            echo "EC2_SSH_KEY is not a readable private key. Store the complete .pem contents in the secret, not the filename, public key, or a placeholder.";
            echo "The key must begin with -----BEGIN and end with -----END, and an encrypted key needs its passphrase configured in the SSH action.";
            exit 1;
          fi

          # GitHub-hosted runners cannot reach an EC2 private address.
          if [[ "$EC2_HOST" =~ ^10\. ]] || \
             [[ "$EC2_HOST" =~ ^192\.168\. ]] || \
             [[ "$EC2_HOST" =~ ^172\.(1[6-9]|2[0-9]|3[0-1])\. ]] || \
             [[ "$EC2_HOST" =~ ^127\. ]] || \
             [[ "$EC2_HOST" =~ ^169\.254\. ]]; then
            echo "EC2_HOST=$EC2_HOST is a private or link-local address. Set EC2_HOST to the instance's public IPv4 address or public DNS name.";
            exit 1;
          fi

      - name: Check EC2 SSH connectivity
        run: |
          echo "Checking $EC2_HOST:$EC2_PORT from the GitHub runner..."
          if ! timeout 15s bash -c "</dev/tcp/$EC2_HOST/$EC2_PORT" 2>/dev/null; then
            echo "Cannot reach $EC2_HOST:$EC2_PORT. Verify EC2_HOST is the current public IPv4/DNS and that the AWS security group's inbound TCP $EC2_PORT rule allows this runner.";
            echo "Also verify the instance is running, has a public IP, and its subnet route table has an Internet Gateway route.";
            exit 1;
          fi
          echo "TCP connectivity is available."

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'ranjay8848' }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          port: ${{ env.EC2_PORT }}
          timeout: 30s
          command_timeout: 4m
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            
            # Navigate to deployment directory
            cd ${{ secrets.DEPLOY_PATH || '/home/ubuntu/portfolio/Ranjay-portfolio' }}
            
            echo "Deployment started"

            # Pull latest code without waiting indefinitely
            timeout 30s git pull --ff-only origin main || true
            echo "Repository ready"
            
            # Log in to Docker Hub
            printf '%s' "$DOCKER_PASSWORD" | timeout 30s docker login --username "$DOCKER_USERNAME" --password-stdin
            echo "Docker login complete"
            
            # Compose pulls both CI-built images in parallel
            timeout 150s docker compose -f docker-compose.prod.yml pull
            echo "Docker images ready"
            
            # Create .env file from secrets (for production)
            cat > .env << EOF
            NODE_ENV=production
            PORT=5000
            DOCKER_USERNAME=$DOCKER_USERNAME
            MONGODB_URI=${{ secrets.PROD_MONGODB_URI }}
            CLIENT_URL=${{ secrets.PROD_CLIENT_URL }}
            NGINX_PORT=80
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}
            CONTACT_RECEIVER=${{ secrets.CONTACT_RECEIVER }}
            EOF
            
            # Stop only the production containers
            timeout 30s docker compose -f docker-compose.prod.yml down --remove-orphans || true
            
            # Start the images built by GitHub Actions; do not rebuild on EC2
            timeout 60s docker compose -f docker-compose.prod.yml up -d --no-build
            echo "Containers started"
            
            # Verify deployment without waiting on fixed delays
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS http://localhost/health.html > /dev/null && \
                 curl -fsS http://localhost/portfolio-api/status > /dev/null; then
                echo "Services are healthy"
                break
              fi
              if [[ "$attempt" -eq 6 ]]; then
                docker compose -f docker-compose.prod.yml logs --tail=80
                exit 1
              fi
              sleep 5
            done

            # Cleanup must not delay a successful deployment
            docker image prune -f --filter "until=72h" || true
            
            echo "✓ Deployment successful!"

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          for i in {1..5}; do
            if curl -f -s "http://${{ env.EC2_HOST }}/health.html" > /dev/null; then
              echo "✓ Service is healthy"
              exit 0
            fi
            echo "Attempt $i/5 - Service not yet ready, waiting..."
            sleep 10
          done
          echo "⚠️ Service health check timeout - manual verification may be needed"

      - name: Slack notification on success
        if: success() && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Portfolio deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Portfolio Deployment Successful*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Slack notification on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Portfolio deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Portfolio Deployment Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }
