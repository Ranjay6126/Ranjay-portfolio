services:
  portfolio-nginx:
    container_name: portfolio-nginx
    image: ${DOCKER_USERNAME:-ranjay8848}/portfolio-client:latest
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - portfolio-server
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  portfolio-server:
    container_name: portfolio-server
    image: ${DOCKER_USERNAME:-ranjay8848}/portfolio-server:latest
    expose:
      - "5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=${CLIENT_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      - CONTACT_RECEIVER=${CONTACT_RECEIVER}
    restart: unless-stopped
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/portfolio-api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  portfolio-network:
    driver: bridge
